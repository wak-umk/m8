<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Index</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;

        }
        h1 {

            text-align: center;
        }
        .demo-list {
            list-style: none;
            padding: 0;
        }
        .demo-list li {

            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;

        .demo-list a:hover {

        }
